# [impl->req~detection-secrets~1]
# Balayage PLANIFIÉ de l'historique complet par la porte anti-secrets — en
# plus de la porte à chaque poussée : une règle gitleaks ajoutée après coup
# ne voit que les commits futurs, le balayage hebdomadaire rattrape le passé.
# Remontée d'un projet instancié. Actions épinglées par SHA de commit.
name: securite

on:
  schedule:
    # Hebdomadaire (lundi 6 h UTC) : attraper toute fuite passée.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks — historique complet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Porte anti-secrets (balayage complet)
        run: sh tools/secrets.sh scan
