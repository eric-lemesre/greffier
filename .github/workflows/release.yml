# Publication d'une version, déclenchée par le tag et jamais à la main
# (méthode, ch. 8) : le tag vX.Y.Z doit égaler VERSION ; les paquets natifs
# (deb, rpm, dmg, MSI) et les archives Linux sont construits et éprouvés
# par paquets.yml depuis la chaîne épinglée (rust-toolchain.toml,
# Cargo.lock), publiés avec leurs empreintes SHA-256, et la release porte
# la section de NEWS.md de la version. Actions épinglées par SHA de commit.
# [impl->req~chaine-de-verification-du-moteur~1]
# [impl->req~paquets-natifs~1]
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    name: Le tag égale VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Le tag égale VERSION
        run: |
          version="$(cat VERSION)"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || {
            echo "tag ${GITHUB_REF_NAME} différent de VERSION ${version}" >&2
            exit 1
          }

  paquets:
    name: Paquets
    needs: version
    uses: ./.github/workflows/paquets.yml

  publier:
    name: Release
    needs: paquets
    runs-on: ubuntu-latest
    # Écriture limitée à ce job : créer la release et y joindre les paquets.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: paquets-*
          path: dist
          merge-multiple: true

      - name: Empreintes vérifiées
        working-directory: dist
        run: sha256sum -c *.sha256

      - name: Notes de version (section de NEWS.md)
        run: |
          version="$(cat VERSION)"
          awk -v v="## [${version}]" '
            index($0, v) == 1 { dedans = 1; next }
            /^## \[/ && dedans { exit }
            dedans { print }
          ' NEWS.md > notes.md
          [ -s notes.md ] || { echo "NEWS.md : section [${version}] vide ou absente" >&2; exit 1; }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Greffier ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*
