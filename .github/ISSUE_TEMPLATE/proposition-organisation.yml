# [impl->req~issues-flux-avancement~2]
# Entrée du flux [Orga] : même circuit que [Spec], objet différent
# (méthode, gouvernance).
name: Proposition d'organisation
description: Soumettre un document de méthode ou de gouvernance pour consultation
title: "[Orga] "
labels: [à-consulter]
body:
  - type: input
    id: document
    attributes:
      label: Document concerné
      description: Chemin du document fusionné en proposition (on débat d'un texte, pas d'une intention).
      placeholder: docs/methode/11-cycle-de-vie-issues.md
    validations:
      required: true
  - type: textarea
    id: points
    attributes:
      label: Points à trancher
      description: Chaque point avec ses options et une option par défaut — sans défaut, la consultation produit « à revoir », pas une décision. Marquer « séance requise » les points à débattre réellement.
    validations:
      required: true
  - type: dropdown
    id: enjeu
    attributes:
      label: Niveau d'enjeu
      options:
        - S — structurant (arbitrage collégial requis)
        - F — fonctionnel (consultation asynchrone)
    validations:
      required: true
  - type: input
    id: echeance
    attributes:
      label: Échéance de consultation
      description: Défaut 10 jours ouvrés ; passé ce délai, le silence vaut absence d'objection.
    validations:
      required: true
